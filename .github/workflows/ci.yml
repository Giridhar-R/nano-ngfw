name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Sanitizers run on the two Linux compilers. Portability across three
          # toolchains is not decoration -- MSVC, gcc and clang disagree about
          # integer promotion and signed conversion often enough to catch real
          # bugs in a codebase that does nothing but reinterpret wire formats.
          - name: linux-gcc
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DNANO_SANITIZE=ON
          - name: linux-clang
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DNANO_SANITIZE=ON
          - name: windows-msvc
            os: windows-latest
            cmake_args: ""

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: ctest --test-dir build --build-config Debug --output-on-failure

  fuzz:
    name: fuzz-decode
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A short run on every push is not a fuzzing campaign -- it is a regression
      # check. It catches a reintroduced bounds bug within a minute of the commit
      # that caused it, which is when the fix is cheapest.
      - name: Configure
        run: >
          cmake -S . -B build-fuzz
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DNANO_FUZZ=ON

      - name: Build
        run: cmake --build build-fuzz --parallel

      # Seeding from the fixtures gives libFuzzer valid frames to mutate, which
      # reaches the deep paths far faster than starting from random bytes.
      - name: Seed corpus
        run: |
          mkdir -p corpus
          python3 tests/make_fixtures.py captures
          cp captures/*.pcap corpus/

      - name: Run
        run: ./build-fuzz/fuzz/fuzz_decode -max_total_time=60 -print_final_stats=1 corpus/

      - name: Upload crashes
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore

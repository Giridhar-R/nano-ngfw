# nano-ngfw security policy
#
# Rules are first-match-wins with an implicit deny at the bottom. A firewall
# whose default is allow is a router with extra steps.
#
#   zone <name> <cidr>
#   rule <name> from <zone> to <zone> [service <spec,...>] [application <name,...>] action <allow|deny|drop>
#
# service : tcp/443, udp/53, tcp/any, or any
# action  : allow          permit the session
#           deny           refuse and tell the sender (RST / ICMP unreachable)
#           drop           refuse silently -- preferred facing the internet,
#                          because an answer confirms the host exists

zone trust   10.0.0.0/8
zone trust   172.16.0.0/12
zone trust   192.168.0.0/16
zone untrust 0.0.0.0/0

# Outbound web, constrained by application rather than by port.
#
# The service clause admits the session on its first packet, when the port is
# the only thing known about it. The application clause is what judges it once
# App-ID has decided -- so something speaking ssh on 443 is allowed for exactly
# as long as it takes to send a payload, then reclassified and torn down.
rule allow-web  from trust to untrust  service tcp/80,tcp/443  application web-browsing,ssl  action allow

rule allow-dns  from trust to untrust  service udp/53  application dns  action allow

# Telnet is never acceptable, in any direction.
rule block-telnet  from any to any  service tcp/23  action deny

# Unsolicited inbound is dropped rather than denied: silence tells a scanner
# nothing, whereas a refusal confirms the host is there.
rule deny-inbound  from untrust to trust  service any  action drop
